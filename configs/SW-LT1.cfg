! ==========================================================================
! Switch Akses Lantai 1 (User Access)
! PT BANK BARNIBAR — Enterprise Multi-Site Network v4.0
! --------------------------------------------------------------------------
! Dokumen     : Configuration Baseline (As-Built)
! Node GNS3   : SW-LT1 (dokumen lama: ACC-1)
! Peran       : Trunk aman, Port-Security sticky, BPDU Guard, parkir port kosong
! Sumber      : 02-BUKU-KERJA-IMPLEMENTASI.md — 2.3
! Dicetak     : 2026-11-06
! Catatan     : Konfigurasi di bawah adalah baseline yang telah lolos UAT.
!               Password / SNMP community / key disamarkan ([REDACTED]).
! ==========================================================================

hostname ACC-1
no ip domain-lookup

vlan 10
 name LAN-STAFF
vlan 20
 name LAN-TELLER
vlan 30
 name LAN-IT-MGMT
vlan 50
 name WLAN-STAFF
vlan 888
 name BLACKHOLE-UNUSED
vlan 999
 name NATIVE-DEAD
exit

spanning-tree mode rapid-pvst

interface range GigabitEthernet0/1 - 2
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport nonegotiate
 no shutdown
exit

interface GigabitEthernet0/3
 description AKSES-PC-STAFF
 switchport mode access
 switchport access vlan 10
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit

interface GigabitEthernet1/0
 description AKSES-PC-TELLER
 switchport mode access
 switchport access vlan 20
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security mac-address sticky
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit

interface range GigabitEthernet0/0 , GigabitEthernet1/1 - 3 , GigabitEthernet2/0 - 3 , GigabitEthernet3/0 - 3
 description PORT-TIDAK-TERPAKAI-DIKUNCI
 switchport mode access
 switchport access vlan 888
 switchport nonegotiate
 shutdown
exit

! --- END OF CONFIGURATION ---

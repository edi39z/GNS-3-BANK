! ==========================================================================
! Switch Inti 1 (Collapsed Core)
! PT BANK BARNIBAR — Enterprise Multi-Site Network v4.0
! --------------------------------------------------------------------------
! Dokumen     : Configuration Baseline (As-Built)
! Node GNS3   : CORE-1
! Peran       : HSRP Active VLAN 10/30/40/100, STP Root Primary, LACP Po1, DHCP relay
! Sumber      : 02-BUKU-KERJA-IMPLEMENTASI.md — 2.1
! Dicetak     : 2026-11-06
! Catatan     : Konfigurasi di bawah adalah baseline yang telah lolos UAT.
!               Password / SNMP community / key disamarkan ([REDACTED]).
! ==========================================================================

hostname CORE-1
no ip domain-lookup
ip routing

vlan 10
 name LAN-STAFF
vlan 20
 name LAN-TELLER
vlan 30
 name LAN-IT-MGMT
vlan 40
 name RUANG-SERVER
vlan 50
 name WLAN-STAFF
vlan 100
 name TRANSIT-FIREWALL
vlan 888
 name BLACKHOLE-UNUSED
vlan 999
 name NATIVE-DEAD
exit

spanning-tree mode rapid-pvst
spanning-tree vlan 10,30,40,100 root primary
spanning-tree vlan 20,50 root secondary

interface range GigabitEthernet0/0 - 1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport nonegotiate
 channel-group 1 mode active
 no shutdown
exit

interface Port-channel 1
 description TRUNK-INTER-CORE-LACP
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport nonegotiate
 no shutdown
exit

interface range GigabitEthernet0/2 - 3
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk native vlan 999
 switchport nonegotiate
 no shutdown
exit

interface range GigabitEthernet1/0 - 1
 description AKSES-SERVER-DOCKER
 switchport mode access
 switchport access vlan 40
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit

interface Vlan10
 ip address 10.10.10.252 255.255.255.0
 ip helper-address 10.10.40.10
 standby version 2
 standby 10 ip 10.10.10.254
 standby 10 priority 110
 standby 10 preempt
 no shutdown

interface Vlan20
 ip address 10.10.20.252 255.255.255.0
 ip helper-address 10.10.40.10
 standby version 2
 standby 20 ip 10.10.20.254
 standby 20 priority 90
 standby 20 preempt
 no shutdown

interface Vlan30
 ip address 10.10.30.252 255.255.255.0
 ip helper-address 10.10.40.10
 standby version 2
 standby 30 ip 10.10.30.254
 standby 30 priority 110
 standby 30 preempt
 no shutdown

interface Vlan50
 ip address 10.10.50.252 255.255.255.0
 ip helper-address 10.10.40.10
 standby version 2
 standby 50 ip 10.10.50.254
 standby 50 priority 90
 standby 50 preempt
 no shutdown

interface Vlan100
 ip address 10.10.100.252 255.255.255.0
 standby version 2
 standby 100 ip 10.10.100.254
 standby 100 priority 110
 standby 100 preempt
 no shutdown
exit

ip route 0.0.0.0 0.0.0.0 10.10.100.1
clock timezone WIB 7 0
service timestamps log datetime msec localtime show-timezone
ntp server 10.10.100.1
logging host 10.10.40.30
logging trap informational

! --- END OF CONFIGURATION ---
